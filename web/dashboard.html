<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>控制台 - 卡密接口平台</title>
    <link rel="stylesheet" href="/web/assets/styles.css" />
  </head>
  <body>
    <div class="topbar">
      <div class="container">
        <div class="brand">
          <div class="logo" aria-hidden="true"></div>
          <div>
            <h1>卡密接口平台</h1>
            <div class="muted-2" style="font-size: 12px">控制台</div>
          </div>
        </div>
        <div class="row">
          <span class="pill">用户：<strong id="userText">-</strong></span>
          <span class="pill hidden" id="merchantTag"><strong>商户</strong></span>
          <span class="pill hidden" id="adminTag"><strong>管理员</strong></span>
          <button class="btn small" id="refreshMeBtn" type="button">刷新</button>
          <button class="btn small danger" id="logoutBtn" type="button">退出</button>
        </div>
      </div>
    </div>

    <main class="hero">
      <div class="container">
        <!-- 快捷导航 -->
        <div class="grid cols-4" style="margin-bottom: 24px;">
          <a class="nav-card" href="/web/shop.html">
            <div class="icon" style="background: linear-gradient(135deg, rgba(139, 92, 246, 0.1) 0%, rgba(167, 139, 250, 0.1) 100%);">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M4.5 6.5h15v12h-15z" stroke="var(--codex-color)" stroke-width="1.8" stroke-linejoin="round"/>
                <path d="M7.5 9.5h9M7.5 12.5h9M7.5 15.5h6" stroke="var(--codex-color)" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="title">购卡中心</div>
            <div class="desc">购买 Codex / Gemini / Claude 卡密</div>
          </a>
          <a class="nav-card hidden" id="merchantCenterCard" href="/web/merchant.html">
            <div class="icon" style="background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, rgba(52, 211, 153, 0.1) 100%);">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M3 21h18M5 21V7l8-4 8 4v14M8 21v-9a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v9" stroke="var(--success)" stroke-width="1.8" stroke-linejoin="round"/>
              </svg>
            </div>
            <div class="title">商户中心</div>
            <div class="desc">管理店铺、查看收益</div>
          </a>
          <a class="nav-card" id="shareCenterCard" href="/web/share.html">
            <div class="icon" style="background: linear-gradient(135deg, rgba(244, 114, 182, 0.1) 0%, rgba(251, 146, 60, 0.1) 100%);">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8" stroke="var(--danger)" stroke-width="1.8" stroke-linejoin="round"/>
                <path d="M16 6l-4-4-4 4" stroke="var(--danger)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M12 2v13" stroke="var(--danger)" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="title">分享中心</div>
            <div class="desc">推广赚返利</div>
          </a>
          <a class="nav-card" id="applyMerchantCard" href="/web/merchant-apply.html">
            <div class="icon" style="background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, rgba(52, 211, 153, 0.1) 100%);">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M3 21h18M5 21V7l8-4 8 4v14M8 21v-9a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v9" stroke="var(--success)" stroke-width="1.8" stroke-linejoin="round"/>
              </svg>
            </div>
            <div class="title">申请商户</div>
            <div class="desc">开通您的专属店铺</div>
          </a>
          <a class="nav-card" href="#" id="announcementEntryBtn">
            <div class="icon" style="background: linear-gradient(135deg, rgba(251, 191, 36, 0.12) 0%, rgba(234, 179, 8, 0.12) 100%);">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M4 6h12a4 4 0 0 1 4 4v7a1 1 0 0 1-1 1h-3.5l-3.5 3v-3H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1Z" stroke="var(--warning)" stroke-width="1.8" stroke-linejoin="round"/>
                <path d="M7.5 10h7M7.5 13h4.5" stroke="var(--warning)" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="title">平台公告</div>
            <div class="desc">查看最新公告与入群二维码</div>
          </a>
          <a class="nav-card hidden" id="adminEntryCard" href="/web/admin.html">
            <div class="icon" style="background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(96, 165, 250, 0.1) 100%);">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M12 3 20 7v6c0 5-4 8-8 9-4-1-8-4-8-9V7l8-4Z" stroke="var(--gemini-color)" stroke-width="1.8" stroke-linejoin="round"/>
                <path d="M9.5 12.5 11 14l3.5-4" stroke="var(--gemini-color)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <div class="title">管理后台</div>
            <div class="desc">产品、订单、卡密管理</div>
          </a>
        </div>

        <div class="split">
          <!-- 侧边栏 -->
          <aside class="card sidebar">
            <div class="bd">
              <div class="nav" style="margin-top: 14px">
                <button class="btn small active" data-nav="overview" type="button">
                  <svg viewBox="0 0 24 24" fill="none">
                    <path d="M4 13.5V20a1 1 0 0 0 1 1h5v-7H5a1 1 0 0 1-1-1Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                    <path d="M20 10.5V20a1 1 0 0 1-1 1h-5v-9h5a1 1 0 0 0 1-1Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                    <path d="M3 10.5 12 3l9 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                  概览
                </button>
              </div>
            </div>
          </aside>

          <!-- 内容区 -->
          <section class="content">
            <div class="stack">
              <!-- 概览页面 -->
              <section class="card" data-view="overview">
                <div class="hd">
                  <h2>欢迎回来！</h2>
                  <span class="badge">Dashboard</span>
                </div>
                <div class="bd">
                  <div class="muted" style="margin-bottom: 14px;">
                    这是您的控制台，您可以购买卡密、申请成为商户、分享推广赚取返利。
                  </div>
                  <div class="card inner" style="margin-top: 14px;">
                    <div class="bd">
                      <div class="muted" style="margin-bottom: 8px;">新功能推荐</div>
                      <ul class="referral-rules">
                        <li><strong>商户系统</strong>：申请成为商户，拥有自己的店铺和商品管理权限</li>
                        <li><strong>分享返利</strong>：通过分享链接推广，别人消费后您可获得返利</li>
                      </ul>
                    </div>
                  </div>
                </div>
              </section>
            </div>
          </section>
        </div>
      </div>
    </main>

    <div class="modal-overlay hidden" id="announcementModal">
      <div class="modal announcement-modal">
        <div class="title" id="announcementTitle">平台公告</div>
        <div class="content">
          <div class="announcement-grid">
            <div class="markdown" id="announcementContent"></div>
            <div class="announcement-qr">
              <div class="muted-2" style="font-size: 12px; margin-bottom: 8px;">入群二维码</div>
              <img id="announcementQrImg" alt="入群二维码" />
              <div class="muted-2" id="announcementQrEmpty" style="font-size: 12px;">暂无二维码</div>
            </div>
          </div>
        </div>
        <div class="actions">
          <button class="btn primary" id="announcementCloseBtn" type="button">我已阅读</button>
        </div>
      </div>
    </div>

    <div id="toast-root" class="toast-root"></div>
    <script src="/web/assets/shared.js"></script>
    <script>
      (function () {
        const { qs, apiRequest, requireAuth, toast, formatError } = window.App;

        async function init() {
          try {
            const user = await requireAuth({ redirectTo: "/" });
            qs("#userText").textContent = user.username;

            if (user.is_admin) {
              qs("#adminTag").classList.remove("hidden");
              qs("#adminEntryCard")?.classList.remove("hidden");
            }

            // 商户相关显示
            if (user.is_merchant && user.merchant_id) {
              qs("#merchantTag").classList.remove("hidden");
              qs("#merchantCenterCard")?.classList.remove("hidden");
              qs("#applyMerchantCard")?.classList.add("hidden");
            } else {
              qs("#applyMerchantCard")?.classList.remove("hidden");
            }

            loadAnnouncement();
          } catch (err) {
            toast({ title: "错误", message: formatError(err), type: "error" });
          }
        }

        async function loadAnnouncement() {
          try {
            const data = await apiRequest("/announcements");
            if (!data || !data.active) return;

            if (data.title) qs("#announcementTitle").textContent = data.title;
            if (data.content) qs("#announcementContent").innerHTML = data.content;

            const qrImg = qs("#announcementQrImg");
            const qrEmpty = qs("#announcementQrEmpty");
            if (data.group_qr_url) {
              qrImg.src = data.group_qr_url;
              qrImg.style.display = "block";
              qrEmpty.style.display = "none";
            } else {
              qrImg.style.display = "none";
              qrEmpty.style.display = "block";
            }

            qs("#announcementEntryBtn").addEventListener("click", (e) => {
              e.preventDefault();
              qs("#announcementModal").classList.remove("hidden");
            });

            qs("#announcementCloseBtn").addEventListener("click", () => {
              qs("#announcementModal").classList.add("hidden");
            });
          } catch (err) {
            console.error("Failed to load announcement:", err);
          }
        }

        qs("#refreshMeBtn").addEventListener("click", () => window.location.reload());
        qs("#logoutBtn").addEventListener("click", () => {
          window.App.clearToken();
          window.location.href = "/";
        });

        init();
      })();
    </script>
  </body>
</html>
