<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>购卡中心 - 卡密接口平台</title>
    <link rel="stylesheet" href="/web/assets/styles.css" />
  </head>
  <body>
    <div class="topbar">
      <div class="container">
        <div class="brand">
          <div class="logo" aria-hidden="true"></div>
          <div>
            <h1>卡密接口平台</h1>
            <div class="muted-2" style="font-size: 12px">购卡中心</div>
          </div>
        </div>
        <div class="row">
          <a class="nav-card" href="/web/dashboard.html" style="padding: 8px 16px; font-size: 12px;">
            返回控制台
          </a>
          <span class="pill">支付方式：<strong>支付宝 / 微信</strong></span>
          <button class="btn small" id="themeToggleBtn" type="button" title="切换主题">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/>
              <path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <main class="hero">
      <div class="container">
        <!-- 供应商分类 -->
        <div class="provider-tabs" id="providerTabs"></div>

        <!-- 产品列表 -->
        <div class="grid cols-4" id="productGrid" style="min-height: 300px;">
          <div class="empty-state">
            <div class="icon">加载中...</div>
            <div class="text">正在获取产品列表</div>
          </div>
        </div>

        <!-- 最近购买 -->
        <div class="card" style="margin-top: 24px;">
          <div class="hd">
            <h2>最近购买记录</h2>
            <button class="btn small" id="refreshHistoryBtn" type="button">刷新</button>
          </div>
          <div class="bd">
            <div id="historyList">
              <div class="muted-2" style="text-align: center; padding: 20px;">暂无购买记录</div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- 购买确认弹窗 -->
    <div class="modal-overlay hidden" id="confirmModal">
      <div class="modal">
        <div class="title">确认购买</div>
        <div class="content" id="confirmContent"></div>
        <div class="actions">
          <button class="btn" id="cancelPurchaseBtn" type="button">取消</button>
          <button class="btn primary" id="confirmPurchaseBtn" type="button">确认购买</button>
        </div>
      </div>
    </div>

    <!-- 购买成功弹窗 -->
    <div class="modal-overlay hidden" id="successModal">
      <div class="modal">
        <div class="title" style="color: var(--success);">购买成功！</div>
        <div class="content">
          <div>您的卡密如下，请妥善保存：</div>
          <div class="muted-2" id="purchaseMeta" style="margin-top: 6px;"></div>
          <div class="pre" id="cardCodeDisplay" style="margin-top: 12px; font-size: 14px; font-weight: 600;"></div>
        </div>
        <div class="actions">
          <button class="btn" id="copyCardCodesBtn" type="button">复制</button>
          <button class="btn" id="exportCardCodesBtn" type="button">导出TXT</button>
          <button class="btn primary" id="closeSuccessBtn" type="button">关闭</button>
        </div>
      </div>
    </div>

    <div id="toast-root" class="toast-root"></div>
    <script src="/web/assets/shared.js"></script>
    <script src="/web/assets/shop.js"></script>
  </body>
</html>
