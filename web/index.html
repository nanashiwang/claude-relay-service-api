<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>代理商登录窗口</title>
    <link rel="stylesheet" href="/web/assets/styles.css" />
  </head>
  <body>
    <main class="auth-page">
      <section class="card auth-card">
        <div class="auth-head">
          <div class="logo" aria-hidden="true"></div>
          <div>
            <h1>卡密接口平台</h1>
            <div class="muted-2" style="font-size: 12px">代理商登录窗口</div>
          </div>
        </div>

        <div class="auth-title">
          <h2>代理商登录窗口</h2>
          <div class="tabs" role="tablist" aria-label="登录注册切换">
            <button class="tab active" type="button" role="tab" data-tab="login">登录</button>
            <button class="tab" type="button" role="tab" data-tab="register">注册</button>
          </div>
        </div>

        <div class="auth-body">
          <div id="panel-login">
            <div class="grid" style="gap: 12px">
              <div class="field">
                <label>用户名</label>
                <input class="input" id="loginUsername" placeholder="请输入用户名" autocomplete="username" />
              </div>
              <div class="field">
                <label>密码</label>
                <input
                  class="input"
                  id="loginPassword"
                  type="password"
                  placeholder="请输入密码"
                  autocomplete="current-password"
                />
              </div>
              <div class="field captcha-field">
                <label>验证码</label>
                <div class="captcha-row">
                  <input class="input" id="loginCaptcha" placeholder="请输入验证码" autocomplete="off" />
                  <div class="captcha-box">
                    <img class="captcha-image" data-captcha-image alt="验证码" />
                    <button class="btn ghost small" data-captcha-refresh type="button">换一张</button>
                  </div>
                </div>
              </div>
            </div>
            <div class="form-actions">
              <button class="btn primary" id="loginBtn" type="button">登录</button>
            </div>
            <div class="hint">提示：首次使用请先注册；密码至少 8 位。</div>
          </div>

          <div id="panel-register" class="hidden">
            <div class="grid" style="gap: 12px">
              <div class="field">
                <label>用户名</label>
                <input class="input" id="regUsername" placeholder="3-64 位" autocomplete="username" />
              </div>
              <div class="field">
                <label>密码</label>
                <input class="input" id="regPassword" type="password" placeholder="至少 8 位" autocomplete="new-password" />
              </div>
              <div class="field captcha-field">
                <label>验证码</label>
                <div class="captcha-row">
                  <input class="input" id="regCaptcha" placeholder="请输入验证码" autocomplete="off" />
                  <div class="captcha-box">
                    <img class="captcha-image" data-captcha-image alt="验证码" />
                    <button class="btn ghost small" data-captcha-refresh type="button">换一张</button>
                  </div>
                </div>
              </div>
            </div>
            <div class="form-actions">
              <button class="btn primary" id="registerBtn" type="button">注册</button>
              <button class="btn" id="switchToLoginBtn" type="button">已有账号</button>
            </div>
            <div class="hint">注册成功后会自动登录并跳转到控制台。</div>
          </div>
        </div>
      </section>
    </main>

    <div id="toast-root" class="toast-root"></div>
    <script src="/web/assets/shared.js"></script>
    <script src="/web/assets/login.js"></script>
  </body>
</html>
