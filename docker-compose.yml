services:
  mysql:
    image: mysql:8.0
    container_name: card_platform_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: card_platform
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--default-time-zone=+08:00"
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data:

