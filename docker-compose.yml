services:
  api:
    build: .
    container_name: card_platform_api
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD:-app}@mysql:3306/${MYSQL_DATABASE:-card_platform}?charset=utf8mb4}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXP_MINUTES: ${JWT_ACCESS_TOKEN_EXP_MINUTES:-10080}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-CNY}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      EPAY_BASE_URL: ${EPAY_BASE_URL:-}
      EPAY_PID: ${EPAY_PID:-}
      EPAY_KEY: ${EPAY_KEY:-}
      EPAY_SIGN_TYPE: ${EPAY_SIGN_TYPE:-MD5}
      EPAY_NOTIFY_URL: ${EPAY_NOTIFY_URL:-}
      EPAY_RETURN_URL: ${EPAY_RETURN_URL:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123456}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - web_uploads:/app/web/uploads
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: card_platform_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-card_platform}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--default-time-zone=+08:00"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
volumes:
  mysql_data:
  web_uploads:
